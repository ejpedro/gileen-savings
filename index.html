<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gileen's Farm Funds</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --wood-dark: #5e3512;
            --wood-light: #e6be8a;
            --stardew-green: #5fb141;
            --stardew-red: #e57373;
            --gold-yellow: #ffda00;
            --header-tan: #f4d3a1;
        }

        body {
            background-color: #2c1a11;
            font-family: 'Press Start 2P', cursive;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        #app-container {
            background-color: var(--wood-light);
            border: 6px solid var(--wood-dark);
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 0 #3b220d;
            color: var(--wood-dark);
            text-align: center;
            position: relative;
        }

        #sync-container {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.8rem;
        }

        .sync-star { display: inline-block; transition: color 0.3s ease; }
        .syncing { animation: star-spin 1s linear infinite; color: #795548; }
        .synced { color: var(--gold-yellow); text-shadow: 0 0 5px var(--gold-yellow); }
        .offline { color: var(--stardew-red); }

        @keyframes star-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .stardew-header {
            color: var(--header-tan);
            font-size: 1.1rem;
            text-transform: uppercase;
            margin: 15px 0 25px 0;
            line-height: 1.4;
            text-shadow: 3px 3px 0 var(--wood-dark), -1px -1px 0 var(--wood-dark), 1px -1px 0 var(--wood-dark), -1px 1px 0 var(--wood-dark), 1px 1px 0 var(--wood-dark), 5px 5px 0 rgba(0,0,0,0.4);
            letter-spacing: 2px;
        }

        .gold-display {
            background: rgba(0,0,0,0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px dashed var(--wood-dark);
        }

        h1#total-gold { color: var(--gold-yellow); text-shadow: 2px 2px var(--wood-dark); font-size: 1.4rem; margin: 10px 0; }
        h2#free-money { font-size: 1rem; color: #2e7d32; margin: 5px 0; }
        
        .stat-text { font-size: 0.6rem; margin: 5px 0; text-transform: uppercase; }

        input {
            width: 85%;
            padding: 10px;
            font-family: 'Press Start 2P', cursive;
            border: 4px solid var(--wood-dark);
            margin-bottom: 10px;
            font-size: 0.7rem;
            background: #fff;
        }

        .btn-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }

        button {
            background-color: var(--stardew-green);
            color: white;
            border: none;
            border-bottom: 4px solid #3d702a;
            padding: 8px 12px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            font-size: 0.55rem;
        }

        button.remove { background-color: var(--stardew-red); border-bottom-color: #af4448; }
        button:active { transform: translateY(2px); border-bottom: 0; }

        .quest-board-header { font-size: 0.7rem; color: var(--wood-dark); margin: 20px 0 10px 0; text-decoration: underline; }

        .category-card {
            background: #fff8e1;
            border: 3px solid var(--wood-dark);
            margin-top: 15px;
            padding: 12px;
            text-align: left;
            position: relative;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }

        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #d32f2f;
            padding: 4px 6px;
            font-size: 0.4rem;
            border-bottom: 2px solid #7f0000;
        }

        .category-card h3 { font-size: 0.7rem; margin: 0 0 10px 0; color: #5e3512; width: 85%; }
        .grid-label { font-size: 0.45rem; margin: 8px 0 4px 0; color: #795548; text-transform: uppercase; }
        
        .button-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }

        .bounce { animation: bounce 0.3s ease; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: var(--wood-light);
            border: 6px solid var(--wood-dark);
            padding: 25px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 0 0 4px #2c1a11, 8px 8px 0 rgba(0,0,0,0.3);
        }

        .modal-message { font-size: 0.6rem; line-height: 1.6; color: var(--wood-dark); margin-bottom: 20px; text-transform: uppercase; }
        .modal-input-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .currency-symbol { font-size: 1rem; color: var(--wood-dark); }
        .modal-input { width: 60%; margin-bottom: 0 !important; font-size: 0.8rem; border: 4px solid var(--wood-dark); }
        .modal-btns { display: flex; justify-content: center; gap: 15px; }
        .stardrop-border { border-color: var(--gold-yellow) !important; box-shadow: 0 0 20px var(--gold-yellow), 8px 8px 0 rgba(0,0,0,0.3) !important; }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="sync-container">
            <span id="sync-icon" class="sync-star synced">★</span>
        </div>
        
        <h1 class="stardew-header">Gileen's<br>Farm Funds</h1>

        <div class="gold-display">
            <h1 id="total-gold">$0</h1>
            <p class="stat-text">Total Gold Saved</p>
            <h2 id="free-money">$0</h2>
            <p class="stat-text">Available to Allocate</p>
        </div>

        <input type="number" id="main-input" placeholder="Enter amount...">
        <div class="btn-row">
            <button onclick="depositGold()">ADD GOLD</button>
            <button class="remove" onclick="withdrawGold()">SPEND</button>
        </div>

        <hr style="border: 1px solid var(--wood-dark); margin: 25px 0;">

        <p class="quest-board-header">QUEST BOARD</p>
        <input type="text" id="cat-name-input" placeholder="Quest Objective...">
        <button onclick="createCategory()">START NEW QUEST</button>

        <p class="stat-text" style="margin-top: 30px;">— ACTIVE QUEST LOG —</p>
        <div id="category-list"></div>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div id="modal-box" class="modal-box">
            <p id="modal-message" class="modal-message"></p>
            <div id="modal-input-container" style="display: none;">
                <div class="modal-input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="custom-modal-input" class="modal-input" placeholder="0">
                </div>
            </div>
            <div class="modal-btns">
                <button id="modal-confirm-btn">YES</button>
                <button id="modal-cancel-btn" class="remove">NO</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
